name: L62 weather to Nominal

# Every hour a job starts and checks the L62 WeatherXM station once a minute for ~62 minutes,
# streaming each new reading to Nominal. Jobs queue back-to-back, so data keeps flowing 24/7
# without any PC. If GitHub starts a job late, the gap is filled from the 15-minute history.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

concurrency:
  group: l62-weather
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      # ref: main = start from the LATEST saved progress, not the commit from when the job was queued
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install --quiet -r requirements.txt

      - name: Stream L62 weather to Nominal (~1 hour)
        env:
          NOMINAL_TOKEN: ${{ secrets.NOMINAL_TOKEN }}
          NOMINAL_DATASET_RID: ${{ secrets.NOMINAL_DATASET_RID }}
          NOMINAL_WORKSPACE_RID: ${{ secrets.NOMINAL_WORKSPACE_RID }}
          L62_STATE_FILE: l62_sync_state.json
          L62_LOOP_MINUTES: "62"
          PYTHONUNBUFFERED: "1"
        run: python l62_weather_sync.py --loop

      # Save the last reading sent. Never conflicts: keeps whichever saved time is newest.
      - name: Save progress (last reading sent)
        if: always()
        run: |
          git config user.name "l62-weather-bot"
          git config user.email "l62-weather-bot@users.noreply.github.com"
          cp l62_sync_state.json /tmp/mine.json
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            python - <<'PY'
          import json, os
          mine = json.load(open("/tmp/mine.json"))
          theirs = json.load(open("l62_sync_state.json")) if os.path.exists("l62_sync_state.json") else {"last_ts": ""}
          best = mine if mine.get("last_ts", "") >= theirs.get("last_ts", "") else theirs
          json.dump(best, open("l62_sync_state.json", "w"), indent=2)
          PY
            git add l62_sync_state.json
            git diff --cached --quiet && exit 0
            git commit --quiet -m "Update L62 sync state"
            git push --quiet origin HEAD:main && exit 0
            sleep $((attempt * 5))
          done
          echo "Could not save progress after 5 attempts (data was still sent to Nominal)."
